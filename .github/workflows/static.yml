# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["gh-pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # New job to run performance audits after deployment
  audit:
    # 'needs' ensures this job only runs after the 'deploy' job is complete and successful.
    needs: deploy
    # The URL of the deployed page is accessed from the 'deploy' job's outputs.
    # This ensures we're testing the live site, not a local version.
    runs-on: ubuntu-latest
    steps:
      - name: Running Page Speed Insights
        uses: jakepartusch/psi-action@v1.3
        id: psi
        with:
          # The URL is dynamically passed from the 'deploy' job's output.
          url: ${{ needs.deploy.outputs.page_url }}
          threshold: 90
          strategy: mobile
          # Your Google API key, securely stored as a repository secret.
          key: ${{ secrets.PSI_API_KEY }}

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          # The URL is dynamically passed from the 'deploy' job's output.
          urls: ${{ needs.deploy.outputs.page_url }}
          uploadArtifacts: true
          server: 'false'
          
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
